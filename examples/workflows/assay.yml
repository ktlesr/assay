# Assay'i kendi reponuza kurmak için hazır workflow.
#
# PR açıldığında skill dosyaları değiştiyse suite koşar, karneyi PR yorumuna
# yazar ve regresyon varsa check'i düşürür.
#
# Kurulum adımı YOK: eylem hem `@ktlsr/assay` CLI'ını hem de Claude Code
# host'unu kendi kuruyor. `setup-node` da gerekmiyor — runner'ın node'u yeterli.
# Sizden istenen tek şey bir kimlik bilgisi.

name: Assay

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'assay.suite.yaml'
  push:
    branches: [main]

permissions:
  contents: read
  # Karne yorumu için.
  pull-requests: write
  # Baseline artefaktını indirmek için: bir önceki koşumla karşılaştırma
  # buradan geliyor.
  actions: read

jobs:
  assay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ktlesr/assay@v1
        with:
          suite: assay.suite.yaml
          skill: ./skills/my-skill

          # CI'da 1 yazmayın: tek koşum bir gözlem, ölçüm değil. Kararsızlık
          # ancak N tekrarla görülür ve rapor oranı N ve güven aralığıyla verir.
          repeat: '10'

          # `claude setup-token` ile üretilen uzun ömürlü token. Alternatif:
          # `anthropic-api-key`. İkisi de repository secret'tan gelmeli.
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
