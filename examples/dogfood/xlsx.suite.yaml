# Dogfooding — anthropics/skills xlsx. Bkz. docs/dogfooding.md.

version: 1

target:
  skill: xlsx
  source: anthropics/skills@local-install

environment:
  host: claude-code
  model: claude-haiku-4-5-20251001
  system_prompt_hash: not-provided-by-host
  active_skills: [xlsx]

runs: 10

cases:
  - id: trigger.positive.explicit
    prompt: |
      Create a spreadsheet called quarters.xlsx with a column for the quarter
      and a column for revenue: Q1 100, Q2 120, Q3 134.
    expect: { triggered: true }

  - id: trigger.positive.implicit
    prompt: |
      This CSV has the header on the third row and some junk rows above it.
      Clean it up so I can open it properly. The file is messy.csv.
    expect: { triggered: true }

  - id: trigger.negative.near_neighbor.docx
    prompt: |
      Turn these notes into a Word document called summary.docx:

      # Q3 summary
      - revenue up 12%
    expect: { triggered: false }

  - id: trigger.negative.near_neighbor.pdf
    prompt: |
      Merge report-a.pdf and report-b.pdf into one file called combined.pdf.
    expect: { triggered: false }

  - id: trigger.negative.unrelated
    prompt: Why does this TypeScript union type collapse to never?
    expect: { triggered: false }
