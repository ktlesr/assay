# Yayın hattı. İki tetikleyici, iki farklı iş:
#
#   push (main)        → yalnızca sürüm hazırlığı. Changeset varsa "Version
#                        Packages" PR'ı açılır veya tazelenir. HİÇBİR KOŞULDA
#                        yayımlamaz.
#   workflow_dispatch  → yayın. npm'de bulunmayan sürümleri gönderir.
#
# Yayının ayrı ve elle bir tetikleyici olması kasıtlı. Alternatifi —
# "changeset kalmadıysa yayımla" — main'e atılan HER commit'i bir yayın
# denemesine çevirir; belge düzelten bir commit bile. npm yayını geri
# alınamaz, o yüzden tetiği çekmek açık bir eylem olmalı.
#
# Kimlik doğrulama bugün NPM_TOKEN ile. npm granular access token'ları yazma
# izniyle en fazla 90 gün yaşıyor, yani bu secret düzenli olarak yenilenmek
# zorunda — prosedür docs/operations.md'de. Kalıcı çözüm trusted publishing
# (OIDC): paketler npm'de var olduktan sonra yapılandırılabiliyor ve secret'ı
# tamamen ortadan kaldırıyor.
#
# Depo public olduğu için provenance üretiliyor: yayımlanan her tarball'a,
# hangi commit'ten hangi iş akışıyla derlendiğini söyleyen imzalı bir kanıt
# ekleniyor. Kullanıcı npm sayfasında doğrulayabiliyor.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Yayımlamak için 'yayimla' yaz"
        required: true
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Secrets bağlamı iş seviyesindeki `if` içinde okunamıyor; bu yüzden token'ın
  # varlığı önce bir çıktıya dönüştürülüyor. Token yoksa yayın işi hiç koşmaz
  # ve sebebi loga yazılır — sessizce atlanmaz.
  guard:
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
      publishing: ${{ steps.mode.outputs.publishing }}
    steps:
      # Yayın yalnızca elle tetiklendiğinde ve onay yazıldığında yapılır.
      # Yanlış yazılan onay sessizce sürüm hazırlığına düşmesin diye burada
      # durduruluyor.
      - id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.confirm }}" != "yayimla" ]; then
              echo "::error::Onay metni 'yayimla' değil — yayın yapılmadı."
              exit 1
            fi
            echo "publishing=true" >> "$GITHUB_OUTPUT"
            echo "mod: YAYIN"
          else
            echo "publishing=false" >> "$GITHUB_OUTPUT"
            echo "mod: yalnızca sürüm hazırlığı (push)"
          fi

      - id: check
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN secret'ı tanımlı değil — yayın adımı atlandı. docs/operations.md"
          fi

  release:
    needs: guard
    if: needs.guard.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # sürüm PR'ı ve etiketi
      pull-requests: write
      id-token: write # npm provenance: Sigstore'a OIDC ile kimlik kanıtı
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changesets değişen paketleri bulmak için geçmişi ister

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Token'ın GEÇERLİ olduğu, pahalı adımlardan ÖNCE sınanıyor. `guard` yalnızca
      # secret'ın var olduğunu biliyor; süresi dolmuş bir token da doludur. Bu
      # kontrol olmasaydı hata ancak `pnpm check` ve `pack:check` koştuktan sonra,
      # yayının tam ortasında çıkardı — dört paketin bir kısmı gitmiş olabilirdi.
      - name: npm kimlik doğrulaması geçerli mi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! user=$(npm whoami 2>&1); then
            echo "::error::NPM_TOKEN geçersiz veya süresi dolmuş. npm yazma izinli granular access token'ları en fazla 90 gün yaşar. Yenileme prosedürü: docs/operations.md"
            echo "npm yanıtı: $user"
            exit 1
          fi
          echo "npm kullanıcısı: $user"

      - run: pnpm install --frozen-lockfile

      # Prisma istemcisi repoda tutulmuyor (üretilen kod); typecheck ona bağlı.
      - run: pnpm --filter @ktlsr/assay-db exec prisma generate

      # Yayımlanan bir sürüm geri alınamaz: kontroller publish'ten ÖNCE koşar.
      # Paketlerin kendi prepublishOnly'si de aynı kontrolü koşar; burada
      # tekrarlanması, hata durumunda npm'e hiç ulaşılmamasını garanti eder.
      - run: pnpm check

      # Tarball'a test dosyası, source map veya kaynak sızmadığını kanıtlar.
      - run: pnpm pack:check

      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm version-packages
          # Boş `publish`, action'ı yalnızca sürüm hazırlığı moduna sokar.
          # Yayın komutu yalnızca elle tetiklenen koşumda doluyor.
          publish: ${{ needs.guard.outputs.publishing == 'true' && 'pnpm release' || '' }}
          commit: 'chore(release): sürümleri yükselt'
          title: 'chore(release): sürümleri yükselt'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Aracın "yayımladım" demesi bir iddia; registry'den okumak kanıt. Bu
      # projenin adaptörü de host'un başarı bildirimine aynı sebeple güvenmiyor.
      - name: yayımlanan sürümler registry'de görünüyor mu
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: node tools/verify-published.mjs
