# Assay'in kendi CI'ı. Gerçek host koşumu burada YOK — para harcar ve sır ister.
# Skill ölçümü .github/workflows/dogfood.yml içinde, elle tetiklenir.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Sürüm package.json'daki `packageManager` alanından okunuyor. Burada
      # `version:` de vermek action'ı "Multiple versions of pnpm specified"
      # hatasıyla düşürüyor — tek doğruluk kaynağı `packageManager`.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Prisma istemcisi repoda tutulmuyor (üretilen kod); typecheck ona bağlı.
      - run: pnpm --filter @ktlsr/assay-db exec prisma generate

      - run: pnpm typecheck
      - run: pnpm lint

      # Kapsam eşikleri vitest.config.ts içinde; düşerse bu adım kırmızıya döner.
      # Sır taraması da test paketinin içinde (tools/secrets.test.ts): takip
      # edilen her dosya her koşumda taranıyor.
      - run: pnpm coverage

      # Derleme kırılırsa bunu PR'da görmek, deploy sırasında görmekten iyi.
      # Konteynerin taşıdığı çıktı standalone; onu da burada derliyoruz çünkü
      # geliştirme makinesi Windows ve orada sembolik bağ yetkisi yok.
      - run: pnpm build
        env:
          NEXT_STANDALONE: '1'

      - name: standalone çıktısı üretildi mi
        run: test -f apps/web/.next/standalone/apps/web/server.js

      # Dağıtılan derlemede sır aranıyor. `scan-staged` commit'e gireni,
      # `scan-history` geçmişte kalanı tarıyor; bu üçüncüsü tarayıcıya ve
      # sunucuya gerçekten giden dosyalara bakıyor.
      - run: pnpm scan:build

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
