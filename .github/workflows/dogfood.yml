# Assay'i kendi örnek skill'i üzerinde koşar. Elle tetiklenir: gerçek para harcar.

name: Dogfood

on:
  workflow_dispatch:
    inputs:
      repeat:
        description: Runs per case
        required: false
        default: '10'

permissions:
  contents: read
  actions: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Sürüm package.json'daki `packageManager` alanından okunuyor. Burada
      # `version:` de vermek action'ı "Multiple versions of pnpm specified"
      # hatasıyla düşürüyor — tek doğruluk kaynağı `packageManager`.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prisma istemcisi repoda tutulmuyor; typecheck ona bağlı.
      - run: pnpm --filter @ktlsr/assay-db exec prisma generate
      - run: pnpm typecheck
      # Eylem artık host'u ve CLI'ı kendi kuruyor; burada yalnızca yerel
      # derleme hazırlanıyor, eylem onu yayımlanmış sürüme tercih ediyor.
      - uses: ./
        with:
          suite: examples/widget-manifest.suite.yaml
          skill: ./examples/widget-manifest
          repeat: ${{ inputs.repeat }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
