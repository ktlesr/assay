# Yerel veya tek sunucu kurulumu.
#
# Dokploy bu dosyayı doğrudan kullanabilir; TLS ve alan adı Dokploy'un
# Traefik'inde çözülür, bu yüzden burada 80/443 yok.
#
# Sırlar buraya yazılmaz: `.env` dosyasından gelir (bkz. .env.example).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: assay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: assay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U assay -d assay']
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://assay:${POSTGRES_PASSWORD}@db:5432/assay
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:?set AUTH_URL in .env}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
    ports:
      - '3000:3000'

volumes:
  pgdata:
