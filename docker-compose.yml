# Yerel veya tek sunucu kurulumu.
#
# Dokploy bu dosyayı doğrudan kullanabilir; TLS ve alan adı Dokploy'un
# Traefik'inde çözülür, bu yüzden burada 80/443 yok.
#
# Sırlar buraya yazılmaz: `.env` dosyasından gelir (bkz. .env.example).
#
# AĞ: `web` iki ağda birden. Compose kendi izole ağını kuruyor ve Traefik o
# ağda değil — `dokploy-network`'te. Konteyner yalnızca kendi ağındayken
# Traefik ona ulaşamıyor ve alan adı 404 dönüyor. İlk dağıtımda tam olarak bu
# oldu. `db` bilerek yalnızca iç ağda: dışarıdan erişilebilir olmasının bir
# sebebi yok.
#
# Dokploy'suz, tek başına `docker compose up` yapacaksan `dokploy-network`
# sunucuda bulunmadığı için `external: true` hata verir; o durumda alttaki
# `networks:` bloğunu ve `web`in `dokploy-network` satırını kaldır.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: assay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: assay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U assay -d assay']
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://assay:${POSTGRES_PASSWORD}@db:5432/assay
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:?set AUTH_URL in .env}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      # Yayın modu: `true` iken dashboard, admin, ayarlar ve giriş kapanır
      # (apps/web/middleware.ts). Buradan geçirilmezse ayar konteynere hiç
      # ulaşmaz ve mod sessizce açılmaz — dağıtımdan önce fark edilmesi zor
      # bir hata olurdu.
      ASSAY_PUBLIC_SITE: ${ASSAY_PUBLIC_SITE:-}
      # Üretimde boş kalır. Yalnızca PGlite soketiyle koşarken 1 olmalı.
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-}
    # Host portu YAYINLANMIYOR. Dokploy'un Traefik'i konteynere Docker ağı
    # üzerinden ulaşıyor; `ports:` ile 3000'i host'a bağlamak hem gereksiz hem
    # çakışma kaynağı. İlk dağıtım tam bu yüzden düştü:
    # "Bind for 0.0.0.0:3000 failed: port is already allocated".
    #
    # Compose'u Dokploy'suz, tek başına koşturacaksan bu satırları aç:
    #   ports:
    #     - '3000:3000'
    expose:
      - '3000'
    networks:
      # `default` db'ye ulaşmak için, `dokploy-network` Traefik'in buraya
      # ulaşması için. İkisi de gerekli.
      - default
      - dokploy-network
    labels:
      # Konteyner birden çok ağdayken Traefik hangisini kullanacağını
      # bilemiyor; açıkça söylüyoruz.
      - traefik.docker.network=dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  pgdata:
