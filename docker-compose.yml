# Yerel veya tek sunucu kurulumu.
#
# Dokploy bu dosyayı doğrudan kullanabilir; TLS ve alan adı Dokploy'un
# Traefik'inde çözülür, bu yüzden burada 80/443 yok.
#
# Sırlar buraya yazılmaz: `.env` dosyasından gelir (bkz. .env.example).
#
# AĞ ve Traefik etiketleri buraya YAZILMIYOR. Dokploy dağıtım sırasında
# compose dosyasına kendi Traefik etiketlerini ve ağını ekliyor; elle eklemek
# onunla çakışır. (Bir ara elle eklendi, sorunun sebebi o değildi ve geri
# alındı.)

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: assay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: assay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U assay -d assay']
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://assay:${POSTGRES_PASSWORD}@db:5432/assay
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:?set AUTH_URL in .env}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      # Yayın modu: `true` iken dashboard, admin, ayarlar ve giriş kapanır
      # (apps/web/middleware.ts). Buradan geçirilmezse ayar konteynere hiç
      # ulaşmaz ve mod sessizce açılmaz — dağıtımdan önce fark edilmesi zor
      # bir hata olurdu.
      ASSAY_PUBLIC_SITE: ${ASSAY_PUBLIC_SITE:-}
      # Üretimde boş kalır. Yalnızca PGlite soketiyle koşarken 1 olmalı.
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-}
      # İlk yöneticiyi açan tek seferlik ucun anahtarı. Boşken uç 404 döner.
      # Hesap açıldıktan sonra silinmeli.
      ASSAY_BOOTSTRAP_TOKEN: ${ASSAY_BOOTSTRAP_TOKEN:-}
    # Host portu YAYINLANMIYOR. Dokploy'un Traefik'i konteynere Docker ağı
    # üzerinden ulaşıyor; `ports:` ile 3000'i host'a bağlamak hem gereksiz hem
    # çakışma kaynağı. İlk dağıtım tam bu yüzden düştü:
    # "Bind for 0.0.0.0:3000 failed: port is already allocated".
    #
    # Compose'u Dokploy'suz, tek başına koşturacaksan bu satırları aç:
    #   ports:
    #     - '3000:3000'
    expose:
      - '3000'

volumes:
  pgdata:
