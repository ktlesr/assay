name: Assay
description: Measure whether an Agent Skill still triggers and completes the way it did before.
author: Assay contributors

branding:
  icon: activity
  color: gray-dark

inputs:
  suite:
    description: Path to the case set (YAML).
    required: true
  skill:
    description: Directory of the skill or plugin under test.
    required: true
  repeat:
    description: Runs per case. Overrides the suite. Never set this to 1 in CI.
    required: false
  model:
    description: Model id override. Leave empty to use the suite's pinned model.
    required: false
  allow-unknown:
    description: Treat "nothing could be measured" as success instead of failing.
    required: false
    default: 'false'
  comment:
    description: Post a scorecard as a pull request comment, updating it in place.
    required: false
    default: 'true'
  baseline:
    description: >
      Compare against the newest run stored on the base branch. Requires a
      previous workflow run that uploaded the assay-runs artifact.
    required: false
    default: 'true'
  token:
    description: Token used for the PR comment and for downloading the baseline artifact.
    required: false
    default: ${{ github.token }}

outputs:
  verdict:
    description: pass, fail or unknown.
    value: ${{ steps.assay.outputs.verdict }}
  run-id:
    description: Identifier of the stored run.
    value: ${{ steps.assay.outputs.run-id }}
  report:
    description: Path to the generated HTML report.
    value: ${{ steps.assay.outputs.report }}

runs:
  using: composite
  steps:
    - name: Fetch baseline
      if: inputs.baseline == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BASE_REF: ${{ github.event.pull_request.base.ref || github.ref_name }}
      run: |
        mkdir -p .assay/baseline
        # En son başarılı koşumun artefaktı; yoksa karşılaştırma atlanır.
        gh run download --repo "$GITHUB_REPOSITORY" --name assay-runs --dir .assay/baseline \
          $(gh run list --repo "$GITHUB_REPOSITORY" --branch "$BASE_REF" \
              --workflow "$GITHUB_WORKFLOW" --status success --limit 1 --json databaseId \
              --jq '.[0].databaseId // empty') 2>/dev/null \
          || echo "no baseline artifact on $BASE_REF; the comparison will be skipped"

    - name: Run Assay
      id: assay
      shell: bash
      env:
        ASSAY_SUITE: ${{ inputs.suite }}
        ASSAY_SKILL: ${{ inputs.skill }}
        ASSAY_REPEAT: ${{ inputs.repeat }}
        ASSAY_MODEL: ${{ inputs.model }}
        ASSAY_ALLOW_UNKNOWN: ${{ inputs.allow-unknown }}
      run: node "${{ github.action_path }}/run.mjs"

    # Maskeleme kayıt yazarken, okurken ve raporda basılırken yapılıyor ama
    # artefakt bir gösterim yüzeyi değil, ham dosya. İndiren herkes JSON'u
    # okuyor; kaçırılan tek kanal buydu.
    - name: Scrub run records before upload
      if: always()
      shell: bash
      run: node "${{ github.action_path }}/scrub-runs.mjs" .assay/runs

    - name: Upload report and runs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: assay-runs
        path: |
          .assay/runs
          .assay/report.html
        if-no-files-found: warn

    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: node "${{ github.action_path }}/comment.mjs"
